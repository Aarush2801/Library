<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aarush's portfolio, kept in a pixel-art library by a grumpy librarian." />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="preload" href="/fonts/pressstart2p.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin />
    <title>Aarush's Stacks</title>
  </head>
  <body>
    <main class="app">
      <h1 class="visually-hidden">Aarush's Stacks</h1>
      <div class="stage" id="stage"></div>
      <section class="console" id="console" aria-label="Library console">
        <div class="console__bar">
          <span class="console__title">Aarush's Stacks</span>
        </div>
        <p class="console__caption" data-caption aria-live="polite">Type a command or pick one below</p>
        <ul class="console__commands" data-commands aria-label="Commands"></ul>
        <form class="console__prompt" data-form autocomplete="off">
          <label for="cmd" class="visually-hidden">Command</label>
          <span aria-hidden="true">&gt;</span>
          <input id="cmd" data-input type="text" spellcheck="false" autocapitalize="off" enterkeyhint="go" />
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
